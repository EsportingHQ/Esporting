# Nightly encrypted backup of the Supabase database to Cloudflare R2 (free tier).
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL      Session pooler connection string (IPv4), with the real password filled in
#   BACKUP_PASSPHRASE    long random passphrase; keep copies with 2 trusted people, NOT only here
#   R2_ACCOUNT_ID        Cloudflare account id
#   R2_ACCESS_KEY_ID     R2 API token (Object Read & Write, this bucket only)
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET            bucket name, e.g. esportinghq-backups
# Restore steps: docs/backup-and-restore.md
name: Database backup

on:
  schedule:
    - cron: '30 2 * * *' # 03:30 Lagos time, every night
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Postgres 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump (app data, accounts, storage index)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage \
            --file="esportinghq_$STAMP.dump"
          ls -l "esportinghq_$STAMP.dump"
          # A near-empty dump means something went wrong: fail loudly instead of uploading it.
          test "$(stat -c%s "esportinghq_$STAMP.dump")" -gt 50000

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            --output "esportinghq_$STAMP.dump.gpg" "esportinghq_$STAMP.dump"
          rm "esportinghq_$STAMP.dump"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "esportinghq_$STAMP.dump.gpg" "s3://$R2_BUCKET/db/esportinghq_$STAMP.dump.gpg" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 ls "s3://$R2_BUCKET/db/" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" | tail -5
